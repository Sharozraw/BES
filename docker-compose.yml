version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BESPostgres2024!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bes_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bes_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bes_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-BESPostgres2024!}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_in_production_bes_2024}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_bes_2024}
      JWT_EXPIRE: 24h
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_PATH: /app/uploads
      MAX_FILE_SIZE: 52428800
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - bes_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
    container_name: bes_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - bes_network

volumes:
  postgres_data:
  uploads_data:

networks:
  bes_network:
    driver: bridge
